name: Refresh Open Source cards

on:
  schedule:
    - cron: "37 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: refresh-oss-cards
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - name: Regenerate the Open Source cards
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/refresh_oss_cards.py --write
      - name: Commit, then deploy Pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "$(git status --porcelain index.html assets/images/oss)" ]; then
            git config user.name "A-RYAN-1"
            git config user.email "aryan0deshmukh@gmail.com"
            git add index.html assets/images/oss
            git commit -m "portfolio: refresh Open Source cards from merged PRs"
            git push
            # a push made with GITHUB_TOKEN does not start other workflows, so start the Pages deploy directly
            gh workflow run static.yml --ref main
          fi
